<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>0tomait campaign card</title>

<style>
*{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;overflow:hidden}body{background:#f8fafc;color:#1e293b;font-family:"IBM Plex Sans",Arial,sans-serif}.card{position:relative;width:1200px;height:630px;background:radial-gradient(circle at 95% 10%,rgba(13,148,136,.1),transparent 30%),#f8fafc}.top{position:absolute;top:62px;left:72px;right:72px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:30px;font-weight:700;letter-spacing:-.08em}.logo span,.accent{color:#0d9488}.tag{font:600 15px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#0f766e}.content{position:absolute;top:145px;right:72px;bottom:104px;left:72px;display:grid;grid-template-columns:minmax(0,1.38fr) minmax(310px,.62fr);gap:70px;align-items:center}.copy h1{max-width:760px;margin:0;font-size:72px;line-height:.99;letter-spacing:-.055em}.copy p{max-width:720px;margin:24px 0 0;color:#475569;font-size:24px;line-height:1.4}.panel{border:1px solid #334155;border-radius:6px;background:#0f172a;color:#e2e8f0;box-shadow:0 24px 65px rgba(15,23,42,.16);font:15px/1.5 "IBM Plex Mono",monospace}.panel-head{display:flex;justify-content:space-between;padding:14px 17px;border-bottom:1px solid #334155;color:#94a3b8}.dot{width:9px;height:9px;margin-top:5px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 0 4px rgba(45,212,191,.12)}.rows{padding:8px 0}.row{padding:11px 17px;border-bottom:1px solid rgba(51,65,85,.55)}.row:last-child{border:0}.ok{color:#5eead4}.hold{color:#fbbf24}.muted{display:block;margin-top:2px;color:#94a3b8}.footer{position:absolute;right:72px;bottom:58px;left:72px;display:flex;align-items:end;justify-content:space-between;border-top:1px solid #cbd5e1;padding-top:19px}.url{font:600 17px "IBM Plex Mono",monospace}.offer{color:#64748b;font:500 15px "IBM Plex Mono",monospace}.audit-score{display:flex;align-items:baseline;gap:12px;padding:28px}.audit-score b{font-size:76px;color:#5eead4;line-height:1}.audit-score span{color:#94a3b8}.audit-list{padding:0 22px 22px;color:#cbd5e1}.audit-list div{padding:8px 0;border-top:1px solid #334155}.record{padding:22px}.record b{display:block;color:#5eead4;font-size:48px}.record span{color:#94a3b8}.record-grid{display:grid;grid-template-columns:1fr 1fr}.record-grid div{padding:18px;border-top:1px solid #334155;border-right:1px solid #334155}.record-grid div:nth-child(even){border-right:0}.record-grid strong{display:block;color:#fff;font-size:24px}
</style>
</head>
<body><main class="card"><div class="top"><div class="logo">Øtom<span>AI</span>t</div><div class="tag" id="tag"></div></div><div class="content"><div class="copy"><h1 id="headline"></h1><p id="subhead"></p></div><div class="panel" id="panel"></div></div><div class="footer"><div class="url" id="url">0tomait.com</div><div class="offer" id="offer"></div></div></main>
<script>
const cards={
home:{tag:"AI leverage mapping + agent systems",headline:"Find where AI pays off. Then give it the job.",subhead:"Start with the right level of AI. Install the recurring job only when state, tools, approvals, and verification are justified.",offer:"$500 MAP → $3,500 PILOT",panel:`<div class="panel-head"><span>opportunity / classify</span><span class="dot"></span></div><div class="rows"><div class="row"><span class="ok">PROMPT</span> answer or draft</div><div class="row"><span class="ok">AUTOMATION</span> known fixed path</div><div class="row"><span class="hold">AGENT JOB</span> recurring work + state + tools</div><div class="row"><span class="ok">PROOF</span> verified business outcome</div></div>`},
demo:{tag:"Executable agent-job demo",headline:"A signed contract becomes a ready-to-start project.",subhead:"Five systems reconciled. One approval gate. Payment and kickoff verified. Zero exceptions remaining.",offer:"COMPOSITE DATA · REAL ORCHESTRATION",url:"0tomait.com/agent-job.html",panel:`<div class="panel-head"><span>handoff-1042 / complete</span><span class="dot"></span></div><div class="rows"><div class="row"><span class="ok">TRIGGER</span> contract + won deal</div><div class="row"><span class="ok">RECONCILE</span> five systems</div><div class="row"><span class="hold">APPROVAL</span> invoice + kickoff</div><div class="row"><span class="ok">VERIFY</span><span class="muted">paid · project ready · booked</span></div></div>`},
audit:{tag:"Five-minute diagnostic",headline:"Does your automation survive its engineer?",subhead:"Ten yes-or-no questions expose black boxes, silent failures, missing ownership, and fragile handoffs.",offer:"FREE · UNGATED · SCORED IN THE BROWSER",url:"0tomait.com/win.html",panel:`<div class="panel-head"><span>survival-audit / result</span><span class="dot"></span></div><div class="audit-score"><b>?</b><span>out of 10</span></div><div class="audit-list"><div>credentials + access</div><div>failure visibility</div><div>backup ownership</div><div>documentation + handover</div></div>`},
record:{tag:"Commercial record",headline:"A new offer built on real client work.",subhead:"Four real engagements represented precisely, one published client account, and an executable composite demo.",offer:"NO INVENTED OUTCOMES",panel:`<div class="panel-head"><span>client record</span><span class="dot"></span></div><div class="record"><b>4</b><span>real engagements</span></div><div class="record-grid"><div><strong>1</strong>testimonial</div><div><strong>5</strong>demo systems</div><div><strong>1</strong>active project</div><div><strong>0</strong>open demo exceptions</div></div>`},
difference:{tag:"Prompt versus agent job",headline:"An AI answer is not an operational result.",subhead:"The job earns its price when work keeps arriving and the outcome needs memory, tools, limits, action, and proof.",offer:"QUEUE · STATE · TOOLS · POLICY · VERIFICATION",panel:`<div class="panel-head"><span>conversation → operation</span><span class="dot"></span></div><div class="rows"><div class="row"><span class="ok">START</span> watched work source</div><div class="row"><span class="ok">CONTEXT</span> systems + prior state</div><div class="row"><span class="hold">ACTION</span> written authority</div><div class="row"><span class="ok">DONE</span> source evidence</div></div>`},
price:{tag:"Founding pilot scope",headline:"$3,500 is not a price for a prompt.",subhead:"It covers one installed operational loop: integration, state, approval limits, evaluation, recovery, deployment, and handover.",offer:"THREE WEEKS · 50% START · 50% HANDOVER",panel:`<div class="panel-head"><span>agent-job / pilot</span><span class="dot"></span></div><div class="rows"><div class="row"><span class="ok">1</span> recurring job</div><div class="row"><span class="ok">2</span> connected systems</div><div class="row"><span class="hold">1</span> approval boundary</div><div class="row"><span class="ok">30 DAYS</span> in-scope fixes</div></div>`}
};
const key=new URLSearchParams(location.search).get("card")||"home",c=cards[key]||cards.home;
for(const id of ["tag","headline","subhead","offer","url"])if(c[id])document.getElementById(id).textContent=c[id];
document.getElementById("panel").innerHTML=c.panel;
window.scrollTo(0,0);
</script>
</body></html>
